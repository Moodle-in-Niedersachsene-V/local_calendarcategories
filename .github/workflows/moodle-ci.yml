name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_USER: moodle
          MYSQL_PASSWORD: moodle
          MYSQL_DATABASE: moodle
          MYSQL_ROOT_PASSWORD: moodle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            moodle-branch: MOODLE_501_STABLE
            db-type: mysqli
          - php: '8.4'
            moodle-branch: MOODLE_502_STABLE
            db-type: pgsql

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, zip, gd, intl, pdo, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH

      - name: Install Moodle (${{ matrix.moodle-branch }})
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host=127.0.0.1 \
            --db-user=moodle \
            --db-pass=moodle \
            --db-name=moodle \
            --db-type=${{ matrix.db-type }} \
            --branch=${{ matrix.moodle-branch }} \
            --no-init

      - name: PHP Lint
        if: always()
        run: moodle-plugin-ci phplint ./plugin

      - name: PHP Copy/Paste Detector
        if: always()
        run: moodle-plugin-ci phpcpd ./plugin

      - name: PHP Mess Detector
        if: always()
        run: moodle-plugin-ci phpmd ./plugin

      - name: Moodle Code Checker (moodle-cs)
        if: always()
        run: moodle-plugin-ci codechecker ./plugin

      - name: Moodle PHPDoc Checker
        if: always()
        run: moodle-plugin-ci phpdoc ./plugin

      - name: Validating
        if: always()
        run: moodle-plugin-ci validate ./plugin

      - name: Check upgrade savepoints
        if: always()
        run: moodle-plugin-ci savepoints ./plugin

      - name: Mustache Lint
        if: always()
        run: moodle-plugin-ci mustache ./plugin

      - name: PHPUnit
        if: always()
        run: moodle-plugin-ci phpunit --fail-on-warning ./plugin

      - name: Behat
        if: always()
        run: moodle-plugin-ci behat --profile chrome ./plugin
